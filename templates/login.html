{% extends 'base.html' %}
{% block title %}TrueShot — Connexion{% endblock %}
{% block content %}
<div class="page-container auth-container">

  <div class="auth-logo">
    <span class="logo-check">✓</span> TrueShot
  </div>

  <div class="auth-card">
    <h1 data-key="login_title">Connexion</h1>
    <p data-key="login_sub">Bienvenue sur TrueShot</p>

    {% if error == 'invalid' %}
    <div class="alert alert-error">
      <span data-key="err_invalid">Identifiant ou mot de passe incorrect.</span>
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="auth-field">
        <label data-key="login_id">Nom d'utilisateur ou email</label>
        <input class="auth-input" type="text" name="login_id"
               placeholder="@pseudo ou email" required autocomplete="username">
      </div>

      <div class="auth-field">
        <label data-key="login_pw">Mot de passe</label>
        <input class="auth-input" type="password" name="password"
               placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" data-key="login_btn">
        Se connecter →
      </button>
    </form>

    <p class="auth-switch">
      <span data-key="login_no_account">Pas encore de compte ?</span>
      <a href="/register" data-key="login_register_link">Créer un compte</a>
    </p>
  </div>

</div>
{% endblock %}
